name: Wan2.1-Lite (6GB RAM Final Survival)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLX-Video
        run: |
          python -m pip install --upgrade pip
          pip install mlx-video huggingface_hub Pillow mlx

      - name: Prepare Image
        run: |
          curl -L -o raw.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          # 480x480 is the safest resolution for 6GB
          python3 -c "from PIL import Image; Image.open('raw.png').convert('RGB').resize((480, 480)).save('input.png')"

      - name: Inference (Wan2.1-1.3B 4-Bit)
        run: |
          echo "Launching Lite Wan2.1 (Skipping Heavy T5)..."
          
          # We use the 4-bit model specifically. 
          # The 'mlx_video' module handles the CLIP encoder internally.
          python -m mlx_video.wan_2.generate \
            --model-dir mlx-community/Wan2.1-I2V-14B-720P-MLX-4bit-quantized \
            --image input.png \
            --prompt "rocket launch" \
            --width 480 \
            --height 480 \
            --num-frames 41 \
            --steps 4 \
            --output-path output.mp4

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-video
          path: output.mp4
