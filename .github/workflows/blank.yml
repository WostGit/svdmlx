name: MLX-Native SVD (M-Series Success)

on:
  workflow_dispatch:

jobs:
  mlx-video-gen:
    runs-on: self-hosted
    steps:
      # CRITICAL: This MUST be the first step.
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # Now that the repo is checked out, Python can find the cache keys
      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Removed the 'cache' line temporarily to prevent "No File Matched" errors
          # during this debugging phase.

      - name: 3. Install Core MLX & Clone Examples
        run: |
          python -m pip install --upgrade pip
          pip install mlx huggingface_hub numpy pillow opencv-python tqdm
          
          # Clone the official Apple MLX examples directly into the runner
          git clone https://github.com/ml-explore/mlx-examples.git
          cd mlx-examples/stable_diffusion
          pip install -r requirements.txt

      - name: 4. Image-to-Video Inference (MLX Native)
        run: |
          # Navigate to the correct submodule path
          cd mlx-examples/stable_diffusion
          
          # Download a high-quality seed image
          curl -L -o seed.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          echo "Starting Inference on 14GB Unified Memory..."
          # Running with 5 steps for maximum speed and safety
          python -m video_gen \
            --model stabilityai/stable-video-diffusion-img2vid \
            --image seed.png \
            --num-frames 14 \
            --steps 5 \
            --output runner_result.mp4

      - name: 5. Upload Final Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-svd-video
          path: mlx-examples/stable_diffusion/runner_result.mp4
