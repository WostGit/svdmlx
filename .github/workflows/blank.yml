name: MLX-Native SVD (Ultra-Verbose Debug Edition)

on:
  workflow_dispatch: # Allows manual execution from the GitHub Actions UI

jobs:
  mlx-video-gen:
    runs-on: macos-14 # Targets Apple Silicon M1/M2 Runners with 14GB RAM
    
    steps:
      - name: 1. Workspace Initialization & Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Python Environment & System Audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: 3. System Hardware & Memory Report
        run: |
          echo "--- SYSTEM INFO ---"
          sysctl -n hw.memsize | awk '{print "Total RAM: " $1/1073741824 " GB"}'
          sysctl -n machdep.cpu.brand_string
          echo "-------------------"

      - name: 4. Dependency Installation (Verbose Mode)
        run: |
          echo "Upgrading Pip and installing Core MLX Stack..."
          python -m pip install --upgrade pip
          pip install -v mlx huggingface_hub numpy pillow opencv-python tqdm
          
          echo "Cloning Apple MLX Examples (Official Repository)..."
          git clone --depth 1 https://github.com/ml-explore/mlx-examples.git
          
          echo "Auditing cloned directory structure..."
          ls -R mlx-examples/stable_diffusion
          
          echo "Installing Stable Diffusion specific requirements..."
          cd mlx-examples/stable_diffusion
          pip install -v -r requirements.txt

      - name: 5. Payload Preparation (Asset Fetching)
        run: |
          echo "Downloading Source Image for SVD..."
          # Using a high-quality rocket launch as the reference image
          curl -v -L -o seed.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          echo "Verifying image properties..."
          python3 -c "from PIL import Image; img = Image.open('seed.png'); print(f'Image format: {img.format}, Size: {img.size}')"

      - name: 6. MLX-Native Inference (The Heavy Lifting)
        run: |
          echo "Step 6: Executing Video Generation Logic"
          
          # CRITICAL: We inject the absolute path into PYTHONPATH so Python
          # can find local modules like 'unet.py' and 'vae.py'
          export WORKSPACE_DIR=$(pwd)/mlx-examples/stable_diffusion
          export PYTHONPATH=$PYTHONPATH:$WORKSPACE_DIR
          
          echo "PYTHONPATH is currently: $PYTHONPATH"
          echo "Moving to workspace: $WORKSPACE_DIR"
          cd $WORKSPACE_DIR
          
          # Move the seed image into the active workspace
          mv ../../seed.png .
          
          echo "LAUNCHING SVD GENERATOR..."
          # Parameters:
          # --model: SVD-img2vid (Native FP16/4-bit on MLX)
          # --num-frames: 14 (SVD standard)
          # --steps: 5 (Optimized for speed/RAM on free runners)
          python3 video_gen.py \
            --model stabilityai/stable-video-diffusion-img2vid \
            --image seed.png \
            --num-frames 14 \
            --steps 5 \
            --output final_inference_result.mp4

      - name: 7. Post-Inference Cleanup & Artifact Prep
        if: always()
        run: |
          echo "Checking for output file..."
          if [ -f "mlx-examples/stable_diffusion/final_inference_result.mp4" ]; then
            echo "SUCCESS: Video generated."
            ls -lh mlx-examples/stable_diffusion/final_inference_result.mp4
          else
            echo "FAILURE: Output file not found."
          fi

      - name: 8. Upload Artifact to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-svd-verbose-result
          path: mlx-examples/stable_diffusion/final_inference_result.mp4
          if-no-files-found: error
