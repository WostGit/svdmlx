name: MLX-Native SVD (Verbose 14GB Optimization)

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  mlx-video-generation:
    runs-on: macos-14 # Specifically targets Apple Silicon (M1/M2) runners
    
    steps:
      - name: 1. Clone User Repository
        uses: actions/checkout@v4

      - name: 2. Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # Speeds up subsequent runs

      - name: 3. Install MLX Core & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          # We install core MLX and standard vision processing libraries
          pip install mlx huggingface_hub numpy pillow opencv-python tqdm
          
          # Clone the official Apple MLX Examples repository
          # This repo contains the specialized 'video_gen' logic for SVD
          git clone https://github.com/ml-explore/mlx-examples.git

      - name: 4. Prepare Generation Workspace
        run: |
          # SVD is an Image-to-Video model. It requires a starting frame.
          # We download a high-contrast rocket image as our 'seed'
          curl -L -o input_seed.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          # Move the seed image into the working directory of the MLX script
          mv input_seed.png mlx-examples/stable_diffusion/input_seed.png

      - name: 5. Execute MLX-Native Video Generation
        # This is the critical step where we bypass Torch/MPS
        run: |
          cd mlx-examples/stable_diffusion
          
          # Set PYTHONPATH to the current directory to fix "Module Not Found" errors
          export PYTHONPATH=$PYTHONPATH:.
          
          echo "Starting MLX-native inference..."
          # --model: StabilityAI SVD (uses CLIP, not the massive T5 encoder)
          # --num-frames: 14 (Standard SVD short-form video)
          # --steps: 10 (Balance between speed and visual quality)
          python -m video_gen \
            --model stabilityai/stable-video-diffusion-img2vid \
            --image input_seed.png \
            --num-frames 14 \
            --steps 10 \
            --output github_svd_output.mp4

      - name: 6. Store Generated Artifact
        if: always() # Ensures logs are available even if generation fails
        uses: actions/upload-artifact@v4
        with:
          name: svd-video-result
          path: mlx-examples/stable_diffusion/github_svd_output.mp4
          retention-days: 5
