name: MLX-SVD (6GB RAM Final Scripted Fix)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlx-video huggingface_hub opencv-python Pillow tqdm mlx

      - name: Prepare Assets
        run: |
          curl -L -o raw.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          python3 -c "from PIL import Image; Image.open('raw.png').convert('RGB').resize((384, 384)).save('input.png')"

      - name: Inference (Direct Python Script)
        run: |
          cat << 'EOF' > run_svd.py
          import mlx.core as mx
          from mlx_video.svd.generate import generate
          
          # Force 6GB safety limits
          generate(
              model_path="mlx-community/stable-video-diffusion-img2vid-4bit",
              image_path="input.png",
              width=384,
              height=384,
              num_frames=12,
              steps=3,
              output_path="output.mp4"
          )
          EOF
          
          echo "Launching Python script for SVD..."
          python3 run_svd.py

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-result
          path: output.mp4
