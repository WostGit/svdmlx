name: MLX-Video (Wan2.1 6GB Optimization)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Native MLX-Video
        run: |
          python -m pip install --upgrade pip
          # We install the latest mlx-video which includes Wan support
          pip install mlx-video huggingface_hub Pillow mlx

      - name: Prepare Input Image
        run: |
          curl -L -o input_raw.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          # Wan2.1 is flexible, but 480x704 or 512x512 is the sweet spot
          python3 -c "from PIL import Image; Image.open('input_raw.png').convert('RGB').resize((512, 512)).save('input.png')"

      - name: Inference (Wan2.1 - 1.3B Model)
        run: |
          echo "Launching Wan2.1 1.3B (Low RAM Mode)..."
          
          # We use the Wan2.1 1.3B model because it fits in ~2.8GB of RAM.
          # --steps 4: Uses the 'Lightning' distilled approach for speed
          python -m mlx_video.wan_2.generate \
            --model-dir mlx-community/Wan2.1-T2V-1.3B-MLX-4bit \
            --prompt "A cinematic rocket launch, high detail, smooth motion" \
            --image input.png \
            --width 512 \
            --height 512 \
            --num-frames 41 \
            --steps 4 \
            --output-path output.mp4

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-result
          path: output.mp4
