name: MLX-SVD (6GB RAM Final Fix)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # We force install everything needed for the 6GB run
          pip install mlx-video huggingface_hub opencv-python Pillow tqdm mlx

      - name: Prepare Assets
        run: |
          curl -L -o raw.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          # Resize to 384x384 to prevent VAE crash
          python3 -c "from PIL import Image; Image.open('raw.png').convert('RGB').resize((384, 384)).save('input.png')"

      - name: Inference (Direct Entry Fix)
        run: |
          echo "Starting Inference using direct python entry..."
          
          # We use 'python3 -m' to call the module directly, 
          # which bypasses the 'command not found' error.
          # Note: The actual module name for execution is 'mlx_video'
          python3 -m mlx_video svd \
            --model mlx-community/stable-video-diffusion-img2vid-4bit \
            --image input.png \
            --width 384 \
            --height 384 \
            --num-frames 12 \
            --steps 3 \
            --output output.mp4

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-result
          path: output.mp4
