name: MLX-Native SVD (Final Fix)

on:
  workflow_dispatch:

jobs:
  mlx-only-gen:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          # Install core MLX and helper tools
          pip install --upgrade pip
          pip install mlx huggingface_hub numpy pillow opencv-python
          
          # Clone the native MLX implementation
          git clone https://github.com/lucas-mancini/svd-mlx.git
          cd svd-mlx
          pip install -r requirements.txt

      - name: Generate Video (MLX Native)
        run: |
          cd svd-mlx
          # Download a starter image
          curl -L -o input.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          # Force MLX to be conservative with memory
          export MLX_MAX_RECV_BUF_SIZE=1048576
          
          # Run the script. If 'main.py' doesn't exist, we use the library's CLI
          # We use 10 steps and 14 frames to stay within the 5-minute window
          python3 main.py --image input.png --num-frames 14 --steps 10 --output mlx_output.mp4

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-video-result
          path: svd-mlx/mlx_output.mp4
