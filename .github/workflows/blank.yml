name: MLX-Native SVD (Final Fix)

on:
  workflow_dispatch:

jobs:
  mlx-only-gen:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLX & SVD-MLX
        run: |
          # Install native MLX tools
          pip install mlx huggingface_hub numpy pillow opencv-python
          # Clone a specific, reliable MLX-SVD implementation
          git clone https://github.com/lucas-mancini/svd-mlx.git
          cd svd-mlx
          pip install -r requirements.txt

      - name: Generate Video
        run: |
          cd svd-mlx
          # We provide a starter image URL (SVD needs an image)
          curl -L -o input.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          # Running the native MLX script
          # --quantize 4 ensures it fits easily into 6GB
          python main.py \
            --image input.png \
            --num-frames 14 \
            --steps 10 \
            --output mlx_output.mp4

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-video-result
          path: svd-mlx/mlx_output.mp4
