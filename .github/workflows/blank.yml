name: MLX-Video (Wan2.1 Final 6GB Fix)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installing the specific version to ensure Wan support
          pip install mlx-video huggingface_hub Pillow mlx

      - name: Debug Package Structure
        run: |
          echo "--- Verifying Package Structure ---"
          python3 -c "import mlx_video; import os; print('Location:', os.path.dirname(mlx_video.__file__));"
          # This will show us exactly where the wan_2 folder is
          find $(python3 -c "import mlx_video; import os; print(os.path.dirname(mlx_video.__file__))") -name "generate.py"

      - name: Prepare Image
        run: |
          curl -L -o raw.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          python3 -c "from PIL import Image; Image.open('raw.png').convert('RGB').resize((480, 480)).save('input.png')"

      - name: Inference (Direct Entry)
        run: |
          # We are calling the 1.3B-4bit model which is the ONLY one that fits in 6GB.
          # We use 'mlx-video' as a CLI command which is the most stable entry point.
          echo "Launching Video Generation..."
          
          mlx-video wan21-i2v \
            --model mlx-community/Wan2.1-I2V-1.3B-4bit-mlx \
            --image input.png \
            --prompt "A cinematic rocket launch" \
            --width 480 \
            --height 480 \
            --frames 41 \
            --steps 4 \
            --output output.mp4

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-video
          path: output.mp4
