name: MLX-SVD (Ultra-Low 6GB RAM Optimization)

on:
  workflow_dispatch:

jobs:
  generate-micro-video:
    runs-on: macos-14
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Install MLX-Video (Low-Memory Build)
        run: |
          python -m pip install --upgrade pip
          # We install the core library plus specialized image handling
          pip install mlx-video huggingface_hub opencv-python pillow tqdm

      - name: 3. Prepare Downscaled Input
        run: |
          curl -L -o raw_input.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          # Force the image to 384x384. 
          # 512x512 is too heavy for the VAE decode on 6GB RAM.
          python3 -c "from PIL import Image; img = Image.open('raw_input.png').convert('RGB').resize((384, 384)); img.save('input_384.png')"

      - name: 4. Inference (4-Bit + Tiled VAE)
        run: |
          echo "Starting Ultra-Low RAM Inference..."
          
          # We point to the 'mlx-community' 4-bit repo to save ~6GB of RAM instantly.
          # --num-frames: Reduced to 12 to save KV-cache space.
          # --steps: Reduced to 3 for a 'fast draft' that stays under the 6GB ceiling.
          python -m mlx_video.svd.generate \
            --model mlx-community/stable-video-diffusion-img2vid-4bit \
            --image input_384.png \
            --width 384 \
            --height 384 \
            --num-frames 12 \
            --steps 3 \
            --output micro_result.mp4

      - name: 5. Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-ram-video
          path: micro_result.mp4
