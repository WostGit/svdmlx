name: MLX-SVD (6GB RAM Final Fix)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-14
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 3. Install Optimized Stack
        run: |
          python -m pip install --upgrade pip
          # Explicitly installing Pillow and mlx-video in one go
          pip install Pillow mlx-video huggingface_hub opencv-python tqdm

      - name: 4. Prepare 6GB-Safe Assets
        run: |
          curl -L -o raw.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          # We call python -m to ensure we use the environment where Pillow was installed
          python3 -m PIL.Image -c "from PIL import Image; Image.open('raw.png').convert('RGB').resize((384, 384)).save('input.png')" || \
          python3 -c "from PIL import Image; Image.open('raw.png').convert('RGB').resize((384, 384)).save('input.png')"

      - name: 5. Inference (Ultra-Low Memory Mode)
        run: |
          echo "Starting Inference (Targeting < 6GB Usage)..."
          
          # Using mlx-community/stable-video-diffusion-img2vid-4bit
          # This model is pre-quantized to 4-bits, which is critical for 6GB RAM.
          python -m mlx_video.svd.generate \
            --model mlx-community/stable-video-diffusion-img2vid-4bit \
            --image input.png \
            --width 384 \
            --height 384 \
            --num-frames 12 \
            --steps 3 \
            --output output.mp4

      - name: 6. Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-6gb-result
          path: output.mp4
