name: MLX-Native SVD (Final Path Fix)

on:
  workflow_dispatch:

jobs:
  mlx-video-gen:
    runs-on: macos-14
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Install MLX & Examples
        run: |
          python -m pip install --upgrade pip
          pip install mlx huggingface_hub numpy pillow opencv-python tqdm
          
          # Clone official Apple MLX examples
          git clone https://github.com/ml-explore/mlx-examples.git
          cd mlx-examples/stable_diffusion
          pip install -r requirements.txt

      - name: 4. Image-to-Video Inference
        run: |
          cd mlx-examples/stable_diffusion
          
          # Download seed image
          curl -L -o seed.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          echo "Starting Inference..."
          # Calling the file directly (video_gen.py) instead of using -m
          # This bypasses the Python module pathing issues
          python video_gen.py \
            --model stabilityai/stable-video-diffusion-img2vid \
            --image seed.png \
            --num-frames 14 \
            --steps 5 \
            --output runner_result.mp4

      - name: 5. Upload Final Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-svd-video
          path: mlx-examples/stable_diffusion/runner_result.mp4
