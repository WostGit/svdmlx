name: Hyper-Quantized SVD (Direct Pipeline)

on:
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI Stack
        run: |
          # We need 'accelerate' for the memory offloading tricks
          pip install -U mlx diffusers transformers accelerate imageio-ffmpeg 

      - name: Run SVD with Offloading
        run: |
          python3 - <<'EOF'
          import torch
          from diffusers import StableVideoDiffusionPipeline
          from diffusers.utils import load_image, export_to_video
          import os

          # 1. Provide a starter image (SVD requires a 'seed' image)
          # Using a high-contrast image helps the 4-bit model stay coherent
          image_url = "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          image = load_image(image_url).resize((512, 512))

          print("Loading SVD Model with Hyper-Offloading...")
          # We load in fp16 to save 50% RAM immediately
          pipe = StableVideoDiffusionPipeline.from_pretrained(
              "stabilityai/stable-video-diffusion-img2vid",
              torch_dtype=torch.float16,
              variant="fp16"
          )

          # --- HYPER OPTIMIZATION ---
          # This moves every component to the SSD/CPU except the one being computed.
          # It reduces peak RAM from ~18GB down to ~6GB.
          pipe.enable_model_cpu_offload()
          
          # Tiling prevents the VAE from crashing when turning math into pixels.
          pipe.enable_vae_tiling()
          # ---------------------------

          print("Starting video generation (14 frames)...")
          # decode_chunk_size=2 ensures the "Video Decoder" doesn't spike RAM
          frames = pipe(
              image, 
              decode_chunk_size=2, 
              num_frames=14, 
              motion_bucket_id=127,
              fps=7
          ).frames[0]

          export_to_video(frames, "svd_output.mp4", fps=7)
          print("Success! Video saved as svd_output.mp4")
          EOF

      - name: Upload Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-result
          path: svd_output.mp4
