name: Hyper-Quantized SVD (6GB RAM Limit)

on:
  workflow_dispatch:

jobs:
  ultra-low-ram-gen:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Optimized Stack
        run: |
          # 'accelerate' is mandatory for sequential offloading
          pip install -U mlx diffusers transformers accelerate imageio-ffmpeg 

      - name: Generate 14-Frame Video
        run: |
          python3 - <<'EOF'
          import torch
          from diffusers import StableVideoDiffusionPipeline
          from diffusers.utils import load_image, export_to_video

          # 1. Load an image (SVD needs a visual starting point)
          image_url = "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          image = load_image(image_url).resize((512, 512))

          print("Loading SVD with 6GB RAM optimizations...")
          pipe = StableVideoDiffusionPipeline.from_pretrained(
              "stabilityai/stable-video-diffusion-img2vid",
              torch_dtype=torch.float16,
              variant="fp16"
          )

          # --- THE 6GB SURVIVAL KIT ---
          # 1. Sequential Offload: Moves individual LAYERS to disk, not just models.
          # This is the most aggressive RAM saver available.
          pipe.enable_sequential_cpu_offload()
          
          # 2. VAE Tiling: Decodes the video in small 128x128 chunks to avoid RAM spikes.
          pipe.enable_vae_tiling()
          
          # 3. Model Slicing: Processes attention layers in smaller parts.
          pipe.enable_vae_slicing()
          # ---------------------------

          print("Generating frames (this will be slow but safe)...")
          # decode_chunk_size=1 is the absolute minimum (1 frame at a time)
          frames = pipe(
              image, 
              decode_chunk_size=1, 
              num_frames=14, 
              motion_bucket_id=127
          ).frames[0]

          export_to_video(frames, "svd_ultra_low.mp4", fps=7)
          print("Done! Check artifacts for svd_ultra_low.mp4")
          EOF

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: svd-6gb-result
          path: svd_ultra_low.mp4
