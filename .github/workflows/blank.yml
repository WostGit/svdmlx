name: MLX-SVD (6GB RAM Final Fix)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-14
    steps:
      # 1. MUST BE FIRST: Bring the code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python AFTER checkout so caching can find requirements (if needed)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install the specific MLX stack for Low-RAM
      - name: Install Optimized Stack
        run: |
          python -m pip install --upgrade pip
          pip install Pillow mlx-video huggingface_hub opencv-python tqdm

      # 4. Prepare 6GB-Safe Assets
      - name: Prepare Input
        run: |
          curl -L -o raw.png "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          
          # Using a robust one-liner to resize. 
          # 384x384 is the "Safety Zone" for 6GB machines.
          python3 -c "from PIL import Image; Image.open('raw.png').convert('RGB').resize((384, 384)).save('input.png')"

      # 5. Inference (4-Bit + Low Steps)
      - name: Inference
        run: |
          echo "Starting Inference (Targeting < 6GB Usage)..."
          
          # Using the pre-quantized 4-bit model from the community
          # This keeps the weight footprint under 3GB.
          python -m mlx_video.svd.generate \
            --model mlx-community/stable-video-diffusion-img2vid-4bit \
            --image input.png \
            --width 384 \
            --height 384 \
            --num-frames 12 \
            --steps 3 \
            --output output.mp4

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-6gb-result
          path: output.mp4
