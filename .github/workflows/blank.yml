name: Manual Hyper-Quantized SVD (6GB RAM)

on:
  workflow_dispatch:

jobs:
  ultra-low-ram-gen:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Optimized Stack
        run: |
          pip install -U mlx diffusers transformers accelerate imageio-ffmpeg torchvision

      - name: Generate 14-Frame Video
        run: |
          python3 - <<'EOF'
          import torch
          from diffusers import StableVideoDiffusionPipeline
          from diffusers.utils import load_image, export_to_video

          # 1. Load a starter image
          image_url = "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
          image = load_image(image_url).resize((512, 512))

          print("Loading SVD with Manual Component Optimizations...")
          pipe = StableVideoDiffusionPipeline.from_pretrained(
              "stabilityai/stable-video-diffusion-img2vid",
              torch_dtype=torch.float16,
              variant="fp16"
          )

          # --- MANUAL 6GB SURVIVAL KIT ---
          # 1. Sequential Offload still works on the pipeline level
          pipe.enable_sequential_cpu_offload()
          
          # 2. Manual VAE Slicing: Call it on the VAE component directly
          if hasattr(pipe.vae, "enable_slicing"):
              pipe.vae.enable_slicing()

          # 3. Manual VAE Tiling: Call it on the VAE component directly
          if hasattr(pipe.vae, "enable_tiling"):
              pipe.vae.enable_tiling()

          # 4. UNet Forward Chunking
          if hasattr(pipe.unet, "enable_forward_chunking"):
              pipe.unet.enable_forward_chunking()
          # ------------------------------------

          print("Generating 14 frames...")
          # decode_chunk_size=1 is the most RAM-efficient setting
          frames = pipe(
              image, 
              decode_chunk_size=1, 
              num_frames=14, 
              motion_bucket_id=127,
              num_inference_steps=10
          ).frames[0]

          export_to_video(frames, "svd_final_fix.mp4", fps=7)
          print("Success! Video saved as svd_final_fix.mp4")
          EOF

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svd-6gb-manual-video
          path: svd_final_fix.mp4
