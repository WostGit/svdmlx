name: MLX-Video (Wan2.1 Final 6GB Fix - No Hugging Face)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlx-video Pillow mlx

      - name: Verify Local Model Exists
        run: |
          echo "Checking local model path..."
          test -d "./models/Wan2.1-I2V-1.3B-4bit-mlx" || (echo "Model folder not found: ./models/Wan2.1-I2V-1.3B-4bit-mlx" && exit 1)
          find ./models/Wan2.1-I2V-1.3B-4bit-mlx -maxdepth 2 -type f | head

      - name: Create Input Image Locally
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw

          w, h = 480, 480
          img = Image.new("RGB", (w, h), (10, 10, 30))
          draw = ImageDraw.Draw(img)

          # stars
          for p in [(40,60),(120,90),(210,50),(320,110),(400,70),(70,180),(390,180)]:
              draw.ellipse((p[0]-2, p[1]-2, p[0]+2, p[1]+2), fill=(255,255,255))

          # ground glow / launch smoke
          draw.ellipse((140, 360, 340, 470), fill=(90, 90, 110))
          draw.ellipse((170, 390, 310, 470), fill=(140, 140, 160))

          # rocket body
          draw.polygon([(240,120), (210,200), (210,310), (270,310), (270,200)], fill=(230,230,235))
          draw.polygon([(240,90), (210,140), (270,140)], fill=(200,40,40))

          # window
          draw.ellipse((228,170,252,194), fill=(80,170,255))

          # fins
          draw.polygon([(210,280), (180,320), (210,320)], fill=(200,40,40))
          draw.polygon([(270,280), (300,320), (270,320)], fill=(200,40,40))

          # flame
          draw.polygon([(240,310), (222,360), (240,340), (258,360)], fill=(255,170,40))
          draw.polygon([(240,325), (230,350), (240,342), (250,350)], fill=(255,230,120))

          img.save("input.png")
          print("Created input.png")
          PY

      - name: Inference (Local Model)
        run: |
          echo "Launching Video Generation..."
          mlx-video wan21-i2v \
            --model ./models/Wan2.1-I2V-1.3B-4bit-mlx \
            --image input.png \
            --prompt "A cinematic rocket launch, dramatic smoke, bright engine flame, realistic motion" \
            --width 480 \
            --height 480 \
            --frames 41 \
            --steps 4 \
            --output output.mp4

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-video
          path: |
            input.png
            output.mp4
